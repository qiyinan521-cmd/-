<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>个人展示</title>

<style>

body {
    margin: 0;
    background: #ffffff;
    text-align: center;
    font-family: "Microsoft YaHei", sans-serif;
}


/* 图片区域 */

.photo {
    width: 90%;
    max-width: 800px;
    margin-top: 30px;
    border-radius: 10px;
}


/* 红色涂鸦文字 */

.message {

    margin-top: 30px;

    color: red;

    font-size: 32px;

    font-weight: bold;

    font-family:
    "Comic Sans MS",
    "Microsoft YaHei",
    cursive;

    transform: rotate(-2deg);

    text-shadow:
    2px 2px 0 #ffcccc;

}


/* 手机适配 */

@media(max-width:600px){

    .message{
        font-size:24px;
    }

}

</style>

</head>


<body>


<!-- 上方图片 -->

<img src="1.jpg" class="photo" src="photo.jpg">


<!-- 下方红色文字 -->

<div class="message">

吴昊天 和 齐亦楠<br>
祝福伟大的祖国

</div>


</body>

</html>
